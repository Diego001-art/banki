# Разовый перенос: распаковывает bundle.tar.gz из корня, переносит картинки, удаляет старую статику.
name: Apply bundle
on:
  push:
    branches: [main]
    paths: [bundle.tar.gz]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and migrate
        run: |
          set -e
          tar -xzf bundle.tar.gz
          git rm -q --cached bundle.tar.gz && rm bundle.tar.gz
          mkdir -p public
          if [ -d img ]; then mkdir -p public/img && cp -rn img/. public/img/ && git rm -rq img; fi
          if [ -f logo-bird.svg ]; then mv -f logo-bird.svg public/logo-bird.svg; git rm -q --cached logo-bird.svg 2>/dev/null || true; fi
          [ -f index.html ] && git rm -q index.html || true
          [ -d admin ] && git rm -rq admin || true
          for d in $(node -e "require('./data/cities.json').forEach(c=>console.log(c.id))"); do [ -d "$d" ] && git rm -rq "$d" || true; done
          git add -A
          git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Переход на Next.js по ТЗ"
          git push
      - name: Start deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
